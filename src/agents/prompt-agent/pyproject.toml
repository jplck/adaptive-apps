[project]
name = "adaptive-runtime"
version = "0.1.0"
description = "Foundry-compatible prompt-agent runtime for the Adaptive AI Stack."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agent-framework-core==1.19.0",
    "agent-framework-openai==1.14.4",
    "agent-framework-foundry-hosting==1.0.0b260918",
    "azure-ai-agentserver-core==2.2.0",
    "azure-ai-agentserver-responses==2.2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx",
    "openai>=1.30",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff",
    "mypy",
]

[tool.uv]
prerelease = "allow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adaptive_runtime"]

[tool.ruff]
extend = "../../pyproject.toml"
src = ["src", "tests"]

[tool.ruff.lint.isort]
known-first-party = ["adaptive_runtime"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "azure.ai.agentserver.*",
    "agent_framework_openai.*",
    "agent_framework_foundry_hosting.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
