[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "governance-sidecar"
version = "0.1.0"
description = "Outbound model and remote-tool policy proxy using the released AGT engine."
requires-python = ">=3.12"
dependencies = [
    "agent-governance-toolkit-core==4.1.0",
    "fastapi>=0.115",
    "httpx>=0.27,<1",
    "opentelemetry-sdk>=1.45,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
    "pydantic>=2.7",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "respx", "ruff", "mypy"]

[tool.hatch.build.targets.wheel]
packages = ["src/governance_sidecar"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["agentmesh.*", "agent_os.*"]
ignore_missing_imports = true
follow_untyped_imports = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
