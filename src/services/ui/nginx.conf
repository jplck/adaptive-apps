server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location ^~ /models/v1/ {
        resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;
        set $model_gateway model-ingress.${POD_NAMESPACE}.svc.cluster.local;
        rewrite ^/models(/v1/.*)$ $1 break;
        proxy_pass http://$model_gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location ~ ^/agents/[^/]+/ {
        resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;
        set $agent_gateway agent-ingress.${POD_NAMESPACE}.svc.cluster.local;
        proxy_pass http://$agent_gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location /v1/ {
        resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;
        set $agent_gateway agent-ingress.${POD_NAMESPACE}.svc.cluster.local;
        proxy_pass http://$agent_gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location / {
        try_files $uri /index.html;
    }
}
