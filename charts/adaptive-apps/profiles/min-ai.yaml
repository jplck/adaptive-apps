# Reproduces the legacy `min-ai` portfolio chart.
# Identity plus a provider-neutral AI capability marker. KAITO is opt-in.
features:
  identity:
    enabled: true
  istio:
    install: false
    mtls: false
  observability:
    enabled: false
  governance:
    opa: false
    istioExtAuthz: false
  ai:
    enabled: true
  agentGuardrails:
    enabled: false  # optional; opt in per-app with --parameters enableAgentGuardrails=true
