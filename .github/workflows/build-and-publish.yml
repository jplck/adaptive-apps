name: Build and Publish Application Images

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  VERSION: 'latest'

jobs:
  build-ghcr:
    name: Build and push application images to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: src/backend/
            image: adaptive-apps/backend
          - directory: src/ai-agent/
            image: adaptive-apps/ai-agent
          - directory: src/frontend/
            image: adaptive-apps/frontend
          - directory: src/
            dockerfile: src/agents/prompt-agent/Dockerfile
            image: adaptive-apps/prompt-agent
          - directory: src/
            dockerfile: src/agents/editor/Dockerfile
            image: adaptive-apps/editor
          - directory: src/
            dockerfile: src/services/governance-sidecar/Dockerfile
            image: adaptive-apps/governance-sidecar
          - directory: src/services/agent-gateway/
            image: adaptive-apps/agent-gateway
          - directory: src/services/platform-api/
            image: adaptive-apps/platform-api
          - directory: src/services/ui/
            image: adaptive-apps/ui
            build_args: |
              VITE_AUTH_ENABLED=true
              VITE_KEYCLOAK_AUTHORITY=${{ vars.NATIVE_KEYCLOAK_AUTHORITY || 'https://localhost:8444/realms/adaptive' }}
              VITE_KEYCLOAK_CLIENT_ID=adaptive-ui
          - directory: src/services/ui/
            image: adaptive-apps/ui-embedded
            build_args: |
              VITE_EMBEDDED=true
              VITE_AUTH_ENABLED=false
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Normalize GHCR registry
        shell: bash
        run: echo "CONTAINER_REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.directory }}
          file: ${{ matrix.dockerfile || format('{0}Dockerfile', matrix.directory) }}
          build-args: ${{ matrix.build_args || '' }}
          push: true
          tags: ${{ env.CONTAINER_REGISTRY }}/${{ matrix.image }}:${{ env.VERSION }}

      # - name: Scan for vulnerabilities in ${{ matrix.image }}
      #   uses: crazy-max/ghaction-container-scan@v3
      #   with:
      #     image: ${{ env.CONTAINER_REGISTRY }}/${{ matrix.image }}:${{ env.VERSION }}
